name: seizewell
description: "Private, on-device seizure diary with a one-tap seizure timer, rescue-medication timer and a one-page clinic report."
publish_to: 'none'
repository: https://github.com/lobojoel2003/Seizewell
issue_tracker: https://github.com/lobojoel2003/Seizewell/issues

# Semantic version + build number.
# - The part before "+" is the user-facing version (versionName / CFBundleShortVersionString).
# - The part after "+" is the build number (Android versionCode / CFBundleVersion).
#   It must increase with every release. Use `scripts/bump_version.sh` to change it.
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1

  # Storage (encrypted, on-device only)
  drift: ^2.35.4
  sqlite3: ^3.9.1
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Reports, charts and exports
  pdf: ^3.13.1
  printing: ^5.15.1
  fl_chart: ^1.3.1
  share_plus: ^13.3.1
  file_picker: ^13.4.0
  intl: ^0.20.2

  # Platform integrations
  flutter_local_notifications: ^23.0.3
  timezone: ^0.11.2
  quick_actions: ^1.1.1
  local_auth: ^3.0.2
  wakelock_plus: ^1.8.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Native build hooks.
# package:sqlite3 bundles its own SQLite build; we select the SQLCipher
# community edition so the whole diary database is encrypted at rest.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
